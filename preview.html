<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSE CSS Preview</title>
  <link rel="stylesheet" href="boilerplates/css/tse-boilerplate.css">
</head>
<body>
  <main class="container portfolio-page">
    <header class="portfolio-hero">
      <h1 class="gradient-text">The Scriber Experience</h1>
      <p>A preview of the cosmic background, typography, and design tokens.</p>
    </header>

    <section class="portfolio-section" aria-labelledby="components-title">
      <h2 class="gradient-text portfolio-section-title" id="components-title">Explore the design system</h2>
      <div class="grid grid-cols-3">
        <article class="card-glass">
          <h3>Glass card</h3>
          <p>Hover to see the cyan glow effect.</p>
          <a class="btn-eigenscribe" href="#">Explore</a>
        </article>
        <article class="card-glass">
          <h3>Another card</h3>
          <pre class="code-block"><code>--space-lg: 1.618rem;</code></pre>
        </article>
        <article class="card-glass">
          <h3>Responsive layout</h3>
          <p>The three-column grid collapses on narrow screens.</p>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
