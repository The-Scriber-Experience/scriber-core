# ---------------------------------------------------------------------------------------------------------
# 🚀 Publish scriber-core to PyPI (Trusted Publishing / OIDC)
# ---------------------------------------------------------------------------------------------------------
#
# This workflow builds the `scriber-core` distributions with `uv build` and uploads them with
# `uv publish`, following the COOP "Distribution & PyPI Publishing Protocol" documented in
# docs/workspace-setup-guide.md (Section 11) and the official uv / PyPA GitHub Actions guides.
#
# It uses **Trusted Publishing (OIDC)** — no API tokens or secrets are stored in the repo.
#
# ── One-time setup (required before the first release) ───────────────────────────────────────────────
#   1. In the existing PyPI project `scriber-core`, open Settings → Publishing → "Add a new publisher":
#        • Owner:            The-Scriber-Experience
#        • Repository name:  scriber-core
#        • Workflow name:    publish.yml
#        • Environment name: pypi
#      (Optionally configure the same publisher on TestPyPI with environment name `testpypi`.)
#   2. (Recommended) In GitHub → Settings → Environments, create environments named `pypi` and
#      `testpypi`. You can add required reviewers to `pypi` to gate production releases behind a
#      manual approval.
#
# ── How to release ──────────────────────────────────────────────────────────────────────────────────
#   • Production: update pyproject.toml, src/eigenscribe/__init__.py, and CHANGELOG.md; commit and push
#       the release commit, then push an annotated matching version tag (e.g. v2.0.0).
#       The tag must match pyproject.toml; the tag push runs tests → builds → publishes to PyPI.
#   • TestPyPI: use "Run workflow" (workflow_dispatch) on the release commit; manual runs only publish there.
#
# ── Prefer API tokens instead of OIDC? ────────────────────────────────────────────────────────────────
#   Remove the `permissions: id-token: write` + `environment:` blocks from the publish jobs, add a
#   `PYPI_API_TOKEN` repository secret, and change the publish step to:
#       run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
# ---------------------------------------------------------------------------------------------------------

name: Publish to PyPI

on:
  push:
    tags:
      # GitHub tag filters are globs; the build job validates the SemVer tag against pyproject.toml.
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Manual runs publish to TestPyPI only"
        type: choice
        default: testpypi
        options:
          - testpypi

# Least-privilege default for every job; the publishing jobs opt into `id-token: write` explicitly.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------------------------------------
  # 1️⃣ Test across every supported Python version before anything is built or published.
  # -------------------------------------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv (Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run the test suite
        run: uv run --extra dev pytest tests

  # -------------------------------------------------------------------------------------------------------
  # 2️⃣ Build the sdist + wheel once, smoke-test the wheel, and hand the artifacts to the publish jobs.
  #     This job intentionally has NO id-token permission (reduces supply-chain attack surface).
  # -------------------------------------------------------------------------------------------------------
  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify release tag matches project version
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([ab][0-9]+|rc[0-9]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH (optionally with a/b/rc suffix); got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Release tag $TAG_VERSION does not match pyproject.toml version $VERSION" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the built wheel
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python -c "import importlib.metadata as m; import importlib.util; import eigenscribe; from eigenscribe import frontend, cli;
          from eigenscribe.cli.branding import CLI_VERSION;
          assert importlib.util.find_spec('scriber_core') is None;
          assert any(entry.name == 'eigenscribe' and entry.value == 'eigenscribe.cli.main:main' for entry in m.distribution('scriber-core').entry_points);
          assert m.version('scriber-core') == eigenscribe.__version__ == frontend.__version__ == CLI_VERSION;
          print('scriber-core', m.version('scriber-core'), '| eigenscribe', eigenscribe.__version__, '| frontend', frontend.__version__)"

      - name: Smoke-test the installed CLI command
        run: uv run --isolated --no-project --with dist/*.whl eigenscribe --help

      - name: Smoke-test installed module launchers
        run: >-
          uv run --isolated --no-project --with dist/*.whl
          python -c "import subprocess, sys;
          subprocess.run([sys.executable, '-m', 'eigenscribe', '--help'], check=True, capture_output=True);
          subprocess.run([sys.executable, '-m', 'eigenscribe.cli', '--help'], check=True, capture_output=True)"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # -------------------------------------------------------------------------------------------------------
  # 3️⃣ Publish to PyPI — on version-tag pushes only.
  # -------------------------------------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scriber-core/
    permissions:
      id-token: write # Mandatory for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  # -------------------------------------------------------------------------------------------------------
  # 4️⃣ Publish to TestPyPI — manual runs only (the default workflow_dispatch target).
  # -------------------------------------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/scriber-core/
    permissions:
      id-token: write # Mandatory for Trusted Publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/
